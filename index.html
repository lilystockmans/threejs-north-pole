<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎅 Low-Poly North Pole 90° N</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Import map for Three.js ES modules from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Minimalist HUD overlay -->
  <header id="header-hud">
    <h1>The North Pole &middot; 90° N</h1>
    <p class="subtitle">Santa's Workshop &bull; Low-Poly Diorama</p>
  </header>

  <div id="instructions-hud">
    <span id="hint">✨ Click any Christmas tree to light it up!</span>
    <div class="sub-hint">🖱️ Click + Drag to rotate &bull; Scroll to zoom</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
